  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      background: #f0f4ff;
      color: #111827;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .card {
      background: #ffffff;
      border-radius: 16px;
      padding: 2.5rem;
      max-width: 460px;
      width: 100%;
      box-shadow: 0 4px 24px rgba(79, 70, 229, 0.08), 0 1px 4px rgba(0,0,0,0.06);
    }

    .name {
      font-size: 1.875rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.1;
    }

    .role {
      font-size: 0.95rem;
      font-weight: 500;
      color: #4f46e5;
      margin-top: 0.3rem;
    }

    .bio {
      margin-top: 1.25rem;
      font-size: 0.9rem;
      line-height: 1.7;
      color: #4b5563;
    }

    .links {
      margin-top: 1.75rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .link {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      text-decoration: none;
      padding: 0.7rem 0.9rem;
      background: #eef2ff;
      border-radius: 8px;
      transition: background 0.15s, color 0.15s;
      color: #4f46e5;
    }

    .link:hover {
      background: #4f46e5;
      color: #ffffff;
    }

    .link-icon {
      flex-shrink: 0;
      display: flex;
      align-items: center;
    }

    .link-text {
      display: flex;
      flex-direction: column;
      gap: 0.05rem;
      min-width: 0;
    }

    .link-service {
      font-size: 0.7rem;
      font-weight: 500;
      opacity: 0.6;
      line-height: 1;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .link-value {
      font-size: 0.875rem;
      font-weight: 500;
      line-height: 1.2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
  </style>
</head>
